name: Eulerpool
slug: eulerpool
description: Financial data API with 400+ REST endpoints covering global equities and fundamentals, ETFs, insider trades, 13F holdings, macro series from FRED, ECB, IMF, World Bank, OECD and BIS, crypto, FX and commodities. JSON responses, API key auth, free tier of 100k requests per month for non-commercial use. SDKs for Python, TypeScript, Go, Java, R, PHP, Rust and C++.
categories:
