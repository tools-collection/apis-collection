name: Live Tennis API
slug: live-tennis-api
description: Tennis data API with live scores (including serving and break-point state), players with current ranking,
  fixtures, and usage endpoints on a free keyed tier; paid tiers add completed-match history, point-by-point data, H2H,
  match events, market prices, bulk packages, rankings listing, and win probability
categories:
  - Sport & Fitness
type: REST
is_free: true
is_active: true
auth_type: api_key
rate_limits: "Free tier: 30 requests/min, 100 requests/day"
tags:
  - tennis
  - live-scores
  - rankings
  - fixtures
specification:
  type: openapi
  url: https://docs.livetennisapi.com/openapi.yaml
links:
